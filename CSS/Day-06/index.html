<html>

<head>

	<title>Weather Dashboard</title>

	<style>

		*
		{
			margin:0;
			padding:0;
			box-sizing:border-box;
		}

		body
		{
			font-family:Arial,sans-serif;
			background:#eef6fb;
			color:#333;
			text-align:center;
		}

		.weather-container
		{
			width:85%;
			margin:40px auto;
		}

		.header
		{
			background:#4b9ed8;
			color:white;
			padding:35px;
			border-radius:20px;
			margin-bottom:25px;
		}

		.header h1
		{
			font-size:36px;
			margin-bottom:10px;
		}

		.header p
		{
			font-size:17px;
		}

		.current-weather
		{
			background:white;
			padding:30px;
			border-radius:20px;
			border:1px solid #d9e8f2;
			margin-bottom:25px;
		}

		.current-weather img
		{
			width:120px;
			height:120px;
			margin:15px;
		}

		.temperature
		{
			font-size:50px;
			font-weight:bold;
			color:#2878b8;
			margin-bottom:10px;
		}

		.weather-details
		{
			margin-top:20px;
		}

		.detail
		{
			display:inline-block;
			width:20%;
			padding:15px;
			margin:5px;
			background:#f3f8fc;
			border-radius:12px;
			border:1px solid #dceaf3;
			vertical-align:top;
		}

		.detail h3
		{
			color:#2878b8;
			margin-bottom:8px;
		}

		.forecast
		{
			background:white;
			padding:30px;
			border-radius:20px;
			border:1px solid #d9e8f2;
			margin-bottom:25px;
		}

		.forecast h2
		{
			color:#2878b8;
			margin-bottom:25px;
		}

		.day
		{
			display:inline-block;
			width:17%;
			margin:8px;
			padding:20px 10px;
			background:#f3f8fc;
			border:1px solid #dceaf3;
			border-radius:15px;
			vertical-align:top;
			transition:0.3s;
		}

		.day:hover
		{
			transform:translateY(-5px);
			border-color:#4b9ed8;
		}

		.day img
		{
			width:55px;
			height:55px;
			margin:12px;
		}

		.day h3
		{
			color:#2878b8;
		}

		.day p
		{
			margin-top:8px;
		}

		.extra-info
		{
			background:white;
			padding:30px;
			border-radius:20px;
			border:1px solid #d9e8f2;
		}

		.info
		{
			display:inline-block;
			width:30%;
			padding:20px;
			margin:8px;
			background:#f3f8fc;
			border-radius:15px;
			vertical-align:top;
		}

		.info h3
		{
			color:#2878b8;
			margin-bottom:10px;
		}

		.status
		{
			color:#26965c;
			font-weight:bold;
		}

		@media(max-width:700px)
		{
			.weather-container
			{
				width:95%;
			}

			.detail
			{
				width:45%;
			}

			.day
			{
				width:40%;
			}

			.info
			{
				width:80%;
			}
		}

	</style>

</head>

<body>

	<div class="weather-container">

		<div class="header">

			<h1>Weather Dashboard</h1>

			<p>Today's Weather Forecast</p>

		</div>


		<div class="current-weather">

			<h2>Chennai</h2>

			<img src="./images/sunny.png" alt="Sunny Weather">

			<div class="temperature">
				32°C
			</div>

			<p>Sunny</p>

			<div class="weather-details">

				<div class="detail">

					<h3>Feels Like</h3>

					<p>35°C</p>

				</div>


				<div class="detail">

					<h3>Humidity</h3>

					<p>68%</p>

				</div>


				<div class="detail">

					<h3>Wind</h3>

					<p>14 km/h</p>

				</div>


				<div class="detail">

					<h3>Pressure</h3>

					<p>1012 hPa</p>

				</div>

			</div>

		</div>


		<div class="forecast">

			<h2>5-Day Forecast</h2>

			<div class="day">

				<h3>Mon</h3>

				<img src="./images/sunny.png" alt="Sunny">

				<p>33°C / 26°C</p>

			</div>


			<div class="day">

				<h3>Tue</h3>

				<img src="./images/cloudy.png" alt="Cloudy">

				<p>31°C / 25°C</p>

			</div>


			<div class="day">

				<h3>Wed</h3>

				<img src="./images/rainy.png" alt="Rainy">

				<p>29°C / 24°C</p>

			</div>


			<div class="day">

				<h3>Thu</h3>

				<img src="./images/cloudy.png" alt="Cloudy">

				<p>30°C / 25°C</p>

			</div>


			<div class="day">

				<h3>Fri</h3>

				<img src="./images/sunny.png" alt="Sunny">

				<p>34°C / 27°C</p>

			</div>

		</div>


		<div class="extra-info">

			<div class="info">

				<h3>Sunrise</h3>

				<p>6:02 AM</p>

			</div>


			<div class="info">

				<h3>Sunset</h3>

				<p>6:12 PM</p>

			</div>


			<div class="info">

				<h3>Air Quality</h3>

				<p class="status">Good</p>

			</div>

		</div>

	</div>

</body>

</html>
