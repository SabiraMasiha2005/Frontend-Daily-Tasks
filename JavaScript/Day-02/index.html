<html>
<head>
	<title> Task </title>
</head>
<body>
<script>

	<!--Positive and Negative Numbers-->
	
	document.write(" Task -1(Positive Or Negative Numbers) :")
	num=-13
	if(num>0)
	{
	document.write("Number is Positive(+ve)" +"<br>")
	}
	else if(num<0)
	{
	document.write("Number is Negative(-ve)")
	}
	else
	{
	document.write("Number is Zero")
	}
	document.write("<br><br><br>")
	


	<!--Odd Numbers Or Even Numbers-->
	
	document.write("Task -2(Odd Numbers Or Even Numbers) :")
	if(num%2==0)
	{
	document.write("Even Number" +"<br>")
	}
	else
	{
	document.write("Odd Number")
	}
	document.write("<br><br><br>")
	
	
	
	<!--Grade Factors-->
	
	document.write("Task -3(Grade Factors) :")
	marks=85
	if(marks>0 && marks<=40)
	{
	document.write("Your Grade is F" +"<br>")
	}
	else if(marks>41 && marks<=60)
	{
	document.write("Your Grade is b"+"<br>")
	}
	else if(marks>61 && marks<=80)
	{
	document.write("Your Grade is d"+"<br>")
	}
	else if(marks>81 && marks<=90)
	{
	document.write("Your Grade is A"+"<br>")
	}
	else if(marks>91 && marks<=100)
	{
	document.write("Your Grade is O"+"<br>")
	}
	else
	{
	document.write("Your Grade is invalid")
	}
	document.write("<br><br>")
	
	
	
	<!--Leap Year-->
	
	document.write("Task -4(Leap Year) :")
	num=2016
	if(num%4==0)
	{
	document.write("Leap Year" +"<br>")
	}
	else
	{
	document.write("Not a Leap Year")
	}
	
</script>

</head>
</body>
