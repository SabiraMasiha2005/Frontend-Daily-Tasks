<html>

<head>

	<title>Age Calculator</title>

</head>

<body>

<script>

	let birthYear=2005;
	let currentYear=2026;

	let age=currentYear-birthYear;

	document.write("Birth Year = "+birthYear);

	document.write("<br><br>");

	document.write("Current Year = "+currentYear);

	document.write("<br><br>");

	document.write("Age = "+age+" years");

</script>

</body>

</html>
