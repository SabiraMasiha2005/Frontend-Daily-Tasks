<html>

<head>
<title>Order Tracking System</title>
</head>

<body>

<h2>Order Tracking System</h2>

<div id="result"></div>

<script>

class OrderTracking
{
	constructor()
	{
		this.orders=[
			{
				id:"ORD101",
				name:"Masiha",
				status:"Processing"
			},
			{
				id:"ORD102",
				name:"Arun",
				status:"Shipped"
			},
			{
				id:"ORD103",
				name:"Sherin",
				status:"Out for Delivery"
			},
			{
				id:"ORD104",
				name:"Nabil",
				status:"Delivered"
			}
		];
	}

	showOrders()
	{
		let output="";

		for(let i=0;i<this.orders.length;i++)
		{
			output=output+
			this.orders[i].id+
			" - "+
			this.orders[i].name+
			" - "+
			this.orders[i].status+
			"<br>";
		}

		return output;
	}

	updateStatus(orderId,newStatus)
	{
		for(let i=0;i<this.orders.length;i++)
		{
			if(this.orders[i].id==orderId)
			{
				this.orders[i].status=newStatus;

				return "Order "+orderId+" status updated successfully.";
			}
		}

		return "Order Not Found";
	}

	countStatus(status)
	{
		let count=0;

		for(let i=0;i<this.orders.length;i++)
		{
			if(this.orders[i].status==status)
			{
				count++;
			}
		}

		return count;
	}

	getTotalOrders()
	{
		return this.orders.length;
	}
}


let tracking1=new OrderTracking();


let updateMessage=
tracking1.updateStatus(
	"ORD101",
	"Shipped"
);


let output="<h3>========== ORDER TRACKING ==========</h3>";


output=output+
tracking1.showOrders();


output=output+
"<br>--------------------------------<br><br>";


output=output+
updateMessage+
"<br><br>";


output=output+
"Total Orders : "+
tracking1.getTotalOrders()+
"<br>";


output=output+
"Processing : "+
tracking1.countStatus("Processing")+
"<br>";


output=output+
"Shipped : "+
tracking1.countStatus("Shipped")+
"<br>";


output=output+
"Out for Delivery : "+
tracking1.countStatus("Out for Delivery")+
"<br>";


output=output+
"Delivered : "+
tracking1.countStatus("Delivered");


document.getElementById("result").innerHTML=output;

</script>

</body>

</html>
