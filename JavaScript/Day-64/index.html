<html>

<head>
<title>Smart Agriculture & Crop Management System</title>
</head>

<body>

<h2>Smart Agriculture & Crop Management System</h2>

<div id="result"></div>

<script>

class FarmManagement
{
	constructor()
	{
		this.crops=[
			{
				id:101,
				name:"Rice",
				season:"Monsoon",
				area:5,
				yield:2000,
				price:30,
				water:80,
				status:"Growing"
			},
			{
				id:102,
				name:"Wheat",
				season:"Winter",
				area:4,
				yield:1500,
				price:25,
				water:50,
				status:"Growing"
			},
			{
				id:103,
				name:"Tomato",
				season:"Summer",
				area:2,
				yield:1000,
				price:40,
				water:70,
				status:"Ready"
			},
			{
				id:104,
				name:"Cotton",
				season:"Monsoon",
				area:6,
				yield:2500,
				price:60,
				water:40,
				status:"Growing"
			},
			{
				id:105,
				name:"Maize",
				season:"Summer",
				area:3,
				yield:1200,
				price:20,
				water:60,
				status:"Ready"
			}
		];

		this.revenue=0;
	}


	showCrops()
	{
		let output="";

		for(let i=0;i<this.crops.length;i++)
		{
			output=output+
			this.crops[i].id+
			" - "+
			this.crops[i].name+
			" - "+
			this.crops[i].season+
			" - "+
			this.crops[i].area+
			" acres - "+
			this.crops[i].yield+
			" kg - ₹"+
			this.crops[i].price+
			"/kg - "+
			this.crops[i].status+
			"<br>";
		}

		return output;
	}


	addCrop(id,name,season,area,yieldAmount,price,water)
	{
		for(let i=0;i<this.crops.length;i++)
		{
			if(this.crops[i].id==id)
			{
				return "Crop ID Already Exists";
			}
		}

		if(area<=0 || yieldAmount<=0 || price<=0)
		{
			return "Invalid Crop Details";
		}

		this.crops.push(
			{
				id:id,
				name:name,
				season:season,
				area:area,
				yield:yieldAmount,
				price:price,
				water:water,
				status:"Growing"
			}
		);

		return "Crop Added Successfully";
	}


	searchCrop(name)
	{
		let output="";

		for(let i=0;i<this.crops.length;i++)
		{
			if(
				this.crops[i].name.toLowerCase()
				.includes(name.toLowerCase())
			)
			{
				output=output+
				this.crops[i].name+
				" - "+
				this.crops[i].season+
				" - "+
				this.crops[i].yield+
				" kg"+
				"<br>";
			}
		}

		if(output=="")
		{
			output="Crop Not Found";
		}

		return output;
	}


	updateCropStatus(id,newStatus)
	{
		for(let i=0;i<this.crops.length;i++)
		{
			if(this.crops[i].id==id)
			{
				this.crops[i].status=newStatus;

				return "Crop Status Updated Successfully";
			}
		}

		return "Crop Not Found";
	}


	calculateCropRevenue(id)
	{
		for(let i=0;i<this.crops.length;i++)
		{
			if(this.crops[i].id==id)
			{
				if(this.crops[i].status!="Ready")
				{
					return "Crop Is Not Ready For Harvest";
				}

				let amount=
				this.crops[i].yield*
				this.crops[i].price;

				this.revenue=this.revenue+amount;

				this.crops[i].status="Harvested";

				return `
					<h3>========== HARVEST REPORT ==========</h3>

					Crop : ${this.crops[i].name}<br>

					Yield : ${this.crops[i].yield} kg<br>

					Price Per KG : ₹${this.crops[i].price}<br><br>

					<b>Crop Revenue : ₹${amount}</b><br><br>

					Status : Harvested
				`;
			}
		}

		return "Crop Not Found";
	}


	getHighestYieldCrop()
	{
		let highest=this.crops[0];

		for(let i=1;i<this.crops.length;i++)
		{
			if(this.crops[i].yield>highest.yield)
			{
				highest=this.crops[i];
			}
		}

		return highest;
	}


	getSeasonCount(season)
	{
		let count=0;

		for(let i=0;i<this.crops.length;i++)
		{
			if(
				this.crops[i].season.toLowerCase()
				==season.toLowerCase()
			)
			{
				count++;
			}
		}

		return count;
	}


	getWaterUsage()
	{
		let total=0;

		for(let i=0;i<this.crops.length;i++)
		{
			total=total+
			this.crops[i].water*
			this.crops[i].area;
		}

		return total;
	}


	getTotalRevenue()
	{
		return this.revenue;
	}


	getReadyCropCount()
	{
		let count=0;

		for(let i=0;i<this.crops.length;i++)
		{
			if(this.crops[i].status=="Ready")
			{
				count++;
			}
		}

		return count;
	}
}


let farm1=new FarmManagement();


let added=
farm1.addCrop(
	106,
	"Groundnut",
	"Summer",
	2,
	900,
	35,
	45
);


let updated=
farm1.updateCropStatus(101,"Ready");


let harvest=
farm1.calculateCropRevenue(103);


let search=
farm1.searchCrop("Rice");


let highest=
farm1.getHighestYieldCrop();


let monsoonCount=
farm1.getSeasonCount("Monsoon");


let water=
farm1.getWaterUsage();


let ready=
farm1.getReadyCropCount();


let revenue=
farm1.getTotalRevenue();


let output=
"<h3>========== FARM CROP REPORT ==========</h3>";


output=output+
farm1.showCrops();


output=output+
"<br>--------------------------------<br><br>";


output=output+
"<b>Add Crop</b><br><br>";


output=output+
added;


output=output+
"<br><br>";


output=output+
"<b>Update Crop Status</b><br><br>";


output=output+
updated;


output=output+
"<br><br>";


output=output+
harvest;


output=output+
"<br><br>--------------------------------<br><br>";


output=output+
"<b>Search Crop</b><br><br>";


output=output+
search;


output=output+
"<br><br>";


output=output+
"<b>Highest Yield Crop</b><br><br>";


output=output+
highest.name+
" - "+
highest.yield+
" kg";


output=output+
"<br><br>";


output=output+
"Monsoon Crops : "+
monsoonCount+
"<br>";


output=output+
"Total Water Usage : "+
water+
" units<br>";


output=output+
"Ready Crops : "+
ready+
"<br><br>";


output=output+
"<b>Total Harvest Revenue : ₹"+
revenue+
"</b>";


document.getElementById("result").innerHTML=output;

</script>

</body>

</html>
