<!DOCTYPE html>
<html>
<head>
	<title>Remove Duplicate Values</title>
</head>
<body>
<script>
	let a=[10,20,10,30,20,40,30];
	let b=[];

	for(let i=0;i<a.length;i++)
	{
		let found=false;

		for(let j=0;j<b.length;j++)
		{
			if(a[i]==b[j])
			{
				found=true;
			}
		}

		if(found==false)
		{
			b.push(a[i]);
		}
	}
	document.write("Original Array: "+a+"<br>");
	document.write("After Removing Duplicates: "+b);
</script>
</body>
</html>
