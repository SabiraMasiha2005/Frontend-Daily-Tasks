<html>
<head>
    <title>Array Tasks</title>
</head>
<body>
<script>
let arr=[5,1,3];
for (let i=0;i<arr.length;i++) 
{
    for (let j=i+1;j<arr.length;j++) 
    {
        if (arr[i]>arr[j]) 
        {
            let temp=arr[i];
            arr[i]=arr[j];
            arr[j]=temp;
        }
    }
}
document.write("Ascending: "+arr+"<br>");


for (let i=0;i<arr.length;i++) 
{
    for (let j=i+1;j<arr.length;j++) 
    {
        if (arr[i]<arr[j]) 
        {
            let temp=arr[i];
            arr[i]=arr[j];
            arr[j]=temp;
        }
    }
}
document.write("Descending: " + arr);
</script>
</body>
</html>
