<html>

<head>
<title>Smart Waste Collection Management System</title>
</head>

<body>

<h2>Smart Waste Collection & Recycling Management System</h2>

<div id="result"></div>

<script>

class WasteManagement
{
	constructor()
	{
		this.requests=[
			{
				id:101,
				area:"Medavakkam",
				wasteType:"Plastic",
				weight:25,
				fee:500,
				recyclable:true,
				status:"Pending"
			},
			{
				id:102,
				area:"Velachery",
				wasteType:"Food Waste",
				weight:40,
				fee:400,
				recyclable:false,
				status:"Scheduled"
			},
			{
				id:103,
				area:"Tambaram",
				wasteType:"Paper",
				weight:30,
				fee:300,
				recyclable:true,
				status:"Pending"
			},
			{
				id:104,
				area:"Sholinganallur",
				wasteType:"Metal",
				weight:50,
				fee:1000,
				recyclable:true,
				status:"Collected"
			},
			{
				id:105,
				area:"Pallikaranai",
				wasteType:"Food Waste",
				weight:20,
				fee:200,
				recyclable:false,
				status:"Scheduled"
			}
		];

		this.revenue=0;

		for(let i=0;i<this.requests.length;i++)
		{
			if(this.requests[i].status=="Collected")
			{
				this.revenue=
				this.revenue+this.requests[i].fee;
			}
		}
	}


	showRequests()
	{
		let output="";

		for(let i=0;i<this.requests.length;i++)
		{
			let recycling="";

			if(this.requests[i].recyclable)
			{
				recycling="Recyclable";
			}
			else
			{
				recycling="Non-Recyclable";
			}

			output=output+
			this.requests[i].id+
			" - "+
			this.requests[i].area+
			" - "+
			this.requests[i].wasteType+
			" - "+
			this.requests[i].weight+
			" kg - ₹"+
			this.requests[i].fee+
			" - "+
			recycling+
			" - "+
			this.requests[i].status+
			"<br>";
		}

		return output;
	}


	addRequest(id,area,wasteType,weight,fee,recyclable)
	{
		for(let i=0;i<this.requests.length;i++)
		{
			if(this.requests[i].id==id)
			{
				return "Request ID Already Exists";
			}
		}

		if(weight<=0 || fee<0)
		{
			return "Invalid Weight or Fee";
		}

		this.requests.push(
			{
				id:id,
				area:area,
				wasteType:wasteType,
				weight:weight,
				fee:fee,
				recyclable:recyclable,
				status:"Pending"
			}
		);

		return "Waste Collection Request Added Successfully";
	}


	scheduleCollection(id)
	{
		for(let i=0;i<this.requests.length;i++)
		{
			if(this.requests[i].id==id)
			{
				if(this.requests[i].status!="Pending")
				{
					return "Request Cannot Be Scheduled";
				}

				this.requests[i].status="Scheduled";

				return "Collection Scheduled Successfully";
			}
		}

		return "Request Not Found";
	}


	completeCollection(id)
	{
		for(let i=0;i<this.requests.length;i++)
		{
			if(this.requests[i].id==id)
			{
				if(this.requests[i].status!="Scheduled")
				{
					return "Please Schedule Collection First";
				}

				this.requests[i].status="Collected";

				this.revenue=
				this.revenue+this.requests[i].fee;

				return "Waste Collected Successfully";
			}
		}

		return "Request Not Found";
	}


	searchArea(area)
	{
		let output="";

		for(let i=0;i<this.requests.length;i++)
		{
			if(
				this.requests[i].area.toLowerCase()
				.includes(area.toLowerCase())
			)
			{
				output=output+
				this.requests[i].id+
				" - "+
				this.requests[i].area+
				" - "+
				this.requests[i].wasteType+
				" - "+
				this.requests[i].status+
				"<br>";
			}
		}

		if(output=="")
		{
			output="Area Not Found";
		}

		return output;
	}


	getHeaviestWaste()
	{
		let highest=this.requests[0];

		for(let i=1;i<this.requests.length;i++)
		{
			if(this.requests[i].weight>highest.weight)
			{
				highest=this.requests[i];
			}
		}

		return highest;
	}


	getPendingCount()
	{
		let count=0;

		for(let i=0;i<this.requests.length;i++)
		{
			if(this.requests[i].status=="Pending")
			{
				count++;
			}
		}

		return count;
	}


	getRecyclingWeight()
	{
		let total=0;

		for(let i=0;i<this.requests.length;i++)
		{
			if(
				this.requests[i].recyclable &&
				this.requests[i].status=="Collected"
			)
			{
				total=total+this.requests[i].weight;
			}
		}

		return total;
	}


	getTotalRevenue()
	{
		return this.revenue;
	}


	getWasteTypeCount(type)
	{
		let count=0;

		for(let i=0;i<this.requests.length;i++)
		{
			if(
				this.requests[i].wasteType.toLowerCase()
				==type.toLowerCase()
			)
			{
				count++;
			}
		}

		return count;
	}
}


let waste1=new WasteManagement();


let added=
waste1.addRequest(
	106,
	"Chromepet",
	"Plastic",
	15,
	300,
	true
);


let scheduled=
waste1.scheduleCollection(101);


let completed=
waste1.completeCollection(102);


let search=
waste1.searchArea("Tambaram");


let highest=
waste1.getHeaviestWaste();


let pending=
waste1.getPendingCount();


let recycling=
waste1.getRecyclingWeight();


let plasticCount=
waste1.getWasteTypeCount("Plastic");


let revenue=
waste1.getTotalRevenue();


let output=
"<h3>========== WASTE COLLECTION REPORT ==========</h3>";


output=output+
waste1.showRequests();


output=output+
"<br>--------------------------------<br><br>";


output=output+
"<b>Add Request</b><br><br>";


output=output+
added;


output=output+
"<br><br>";


output=output+
"<b>Schedule Collection</b><br><br>";


output=output+
scheduled;


output=output+
"<br><br>";


output=output+
"<b>Complete Collection</b><br><br>";


output=output+
completed;


output=output+
"<br><br>--------------------------------<br><br>";


output=output+
"<b>Area Search</b><br><br>";


output=output+
search;


output=output+
"<br><br>--------------------------------<br><br>";


output=output+
"<b>Heaviest Waste Request</b><br><br>";


output=output+
highest.area+
" - "+
highest.wasteType+
" - "+
highest.weight+
" kg";


output=output+
"<br><br>";


output=output+
"Pending Requests : "+
pending+
"<br>";


output=output+
"Collected Recyclable Waste : "+
recycling+
" kg"+
"<br>";


output=output+
"Plastic Requests : "+
plasticCount+
"<br><br>";


output=output+
"<b>Total Collection Revenue : ₹"+
revenue+
"</b>";


document.getElementById("result").innerHTML=output;

</script>

</body>

</html>
