<html>

<head>

	<title>Discount Calculator</title>

</head>

<body>

<script>

	let price=2000;
	let discount=15;

	let discountAmount=price*discount/100;

	let finalPrice=price-discountAmount;

	document.write("Original Price = ₹"+price);

	document.write("<br><br>");

	document.write("Discount = "+discount+"%");

	document.write("<br><br>");

	document.write("Discount Amount = ₹"+discountAmount);

	document.write("<br><br>");

	document.write("Final Price = ₹"+finalPrice);

</script>

</body>

</html>
