	<title> Arithmetic Operations </title>

<body>

<h4> Arithmetical Operations </h4>

<script>

	<!--Addition-->
	var a=10
	var b=20
	document.write(a+b +"<br>")
	
	<!--Subtraction-->
	a=70
	b=50
	document.write(a-b +"<br>")
	
	<!--Mutiplication-->
	var a=70
	var b=50
	a=60
	document.write(a*b +"<br>")
	
	<!--Division-->
	var a=70
	var b=50
	document.write(a/b +"<br>")
	
	<!--Modulus-->
	var a=70
	var b=50
	document.write(a%b +"<br>")


</script>
